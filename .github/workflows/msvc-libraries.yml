# Collects the static libraries that Visual Studio toolsets and Windows SDKs
# link into programs, from GitHub-hosted Windows images, and keeps them in a
# release. Those archives are what msvc-signatures.yml generates the pe/
# signature files from, so every signature can be traced to the bytes it
# was made from.
#
# One matrix row (.github/msvc-matrix.json) is one runner: a toolset, with
# every architecture it targets, or a Windows SDK. A row that needs a toolset
# or SDK the image lacks installs it first, through the image's own Visual
# Studio installer or, for SDKs that installer no longer offers, Chocolatey.
#
# The toolsets no current image can install, Visual Studio 2005 to 2013, come
# from Microsoft's own installation media instead: one Linux job per row of
# .github/msvc-legacy-matrix.json downloads the media, checks its SHA-256, and
# unpacks the library packages with 7-Zip, cabextract and msitools.
#
# A pull request only runs the collector's unit tests: the rows occupy a
# dozen Windows runners, and GitHub evaluates a pull request's path filter
# against its whole diff, so every push would restart them. A manual run
# collects every row and creates a release, which is a draft unless
# publish_release is set: the archives are unmodified Microsoft libraries
# (see README.md).

name: Collect MSVC libraries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (default msvc-libs-<UTC date>-<run number>)
        required: false
        type: string
      publish_release:
        description: Publish the release publicly instead of keeping it a draft
        required: false
        type: boolean
        default: false
      rows:
        description: Only these rows of .github/msvc-matrix.json (comma separated; default every row)
        required: false
        type: string
      from_run:
        description: Publish the artifacts of this earlier run instead of collecting again
        required: false
        type: string
  pull_request:
    paths:
      - .github/workflows/msvc-libraries.yml
      - scripts/collect_msvc_libraries.py
      - scripts/summarize_library_assets.py
      - scripts/Install-VisualStudioComponents.ps1
      - scripts/Build-ValidationProbes.ps1
      - scripts/msvc_matrix.py
      - .github/msvc-matrix.json
      - .github/msvc-legacy-matrix.json
      - scripts/extract_legacy_toolset.py
      - scripts/collect_legacy_media.py
      - scripts/collect_masm32.py
      - .github/masm32-matrix.json
      - scripts/collect_mingw_library.py
      - .github/mingw-matrix.json
      - scripts/collect_fedora_library.py
      - .github/fedora-matrix.json
      - scripts/collect_elf_packages.py
      - scripts/fetch_imported_sources.py
      - .github/elf-matrix.json
      - scripts/tests/**
      - validation/**

permissions:
  contents: read

concurrency:
  group: msvc-libraries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify collector
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      rows: ${{ steps.matrix.outputs.rows }}
      legacy_matrix: ${{ steps.matrix.outputs.legacy_matrix }}
      legacy_rows: ${{ steps.matrix.outputs.legacy_rows }}
      masm32_matrix: ${{ steps.matrix.outputs.masm32_matrix }}
      masm32_rows: ${{ steps.matrix.outputs.masm32_rows }}
      mingw_matrix: ${{ steps.matrix.outputs.mingw_matrix }}
      mingw_rows: ${{ steps.matrix.outputs.mingw_rows }}
      fedora_matrix: ${{ steps.matrix.outputs.fedora_matrix }}
      fedora_rows: ${{ steps.matrix.outputs.fedora_rows }}
      elf_matrix: ${{ steps.matrix.outputs.elf_matrix }}
      elf_rows: ${{ steps.matrix.outputs.elf_rows }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run collector unit tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Compile-check scripts
        run: python3 -m py_compile scripts/*.py

      - name: Prepare the collection matrix
        id: matrix
        env:
          ROWS: ${{ inputs.rows }}
        run: python3 scripts/msvc_matrix.py --rows "${ROWS:-}" --github-output "$GITHUB_OUTPUT"

  collect:
    name: Collect ${{ matrix.name }}
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.from_run == '' && needs.verify.outputs.rows != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The rows live in .github/msvc-matrix.json; see scripts/msvc_matrix.py.
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Visual Studio components
        if: matrix.components != ''
        shell: pwsh
        run: >-
          ./scripts/Install-VisualStudioComponents.ps1
          -VersionRange '${{ matrix.vswhere_version }}'
          -Component ('${{ matrix.components }}' -split '\s+')

      # Windows SDKs the image's Visual Studio installer no longer offers
      # come from their standalone installers, which these packages run.
      - name: Install Chocolatey packages
        if: matrix.choco != ''
        shell: pwsh
        run: choco install ${{ matrix.choco }} --yes --no-progress

      # The standalone installer of a Windows SDK that neither the image's
      # Visual Studio installer nor Chocolatey still offers.
      - name: Install a Windows SDK from its standalone installer
        if: matrix.sdk_installer != ''
        shell: pwsh
        env:
          SDK_INSTALLER: ${{ matrix.sdk_installer }}
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
          Invoke-WebRequest -Uri $env:SDK_INSTALLER -OutFile $Installer
          $Process = Start-Process -FilePath $Installer -Wait -PassThru `
            -ArgumentList '/features', '+', '/quiet', '/norestart', '/ceip', 'off'
          Write-Host "winsdksetup.exe exited with $($Process.ExitCode)"
          if ($Process.ExitCode -notin 0, 3010) {
            throw "winsdksetup.exe failed with exit code $($Process.ExitCode)"
          }

      - name: Show installed toolsets and SDKs
        shell: pwsh
        run: |
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          & $VsWhere -products * -format text | Select-String 'installationPath|installationVersion|displayName'
          foreach ($Path in (& $VsWhere -products * -property installationPath)) {
            Get-ChildItem -Directory (Join-Path $Path 'VC/Tools/MSVC') -ErrorAction SilentlyContinue |
              ForEach-Object { "$($_.FullName): $((Get-ChildItem -Directory (Join-Path $_.FullName 'lib') -ErrorAction SilentlyContinue).Name -join ' ')" }
          }
          $V140 = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio 14.0/VC'
          if (Test-Path $V140) {
            "v140 lib: $((Get-ChildItem -Directory (Join-Path $V140 'lib') -ErrorAction SilentlyContinue).Name -join ' ')"
            "v140 atlmfc: $(Test-Path (Join-Path $V140 'atlmfc/lib'))"
          }
          Get-ChildItem -Directory (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Lib') -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.Name): ucrt $((Get-ChildItem -Directory (Join-Path $_.FullName 'ucrt') -ErrorAction SilentlyContinue).Name -join ' ')" }

      # A row may hold several collector invocations, separated by ';'.
      - name: Collect
        shell: bash
        env:
          COLLECT: ${{ matrix.collect }}
        run: |
          set -euo pipefail
          IFS=';' read -ra invocations <<< "$COLLECT"
          for invocation in "${invocations[@]}"; do
            eval "python scripts/collect_msvc_libraries.py $invocation --output \"\$RUNNER_TEMP/assets\""
          done

      - name: Upload assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msvc-libs-${{ matrix.name }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # The same toolset builds programs that link these libraries statically,
      # with linker maps, so the signatures made from them can be checked
      # against the map of a real image.
      - name: Build validation probes
        if: matrix.probe_arches != ''
        shell: pwsh
        run: >-
          ./scripts/Build-ValidationProbes.ps1
          -VersionRange '${{ matrix.vswhere_version }}'
          -Arch ('${{ matrix.probe_arches }}' -split '\s+')
          -Label '${{ matrix.name }}'
          -VcvarsVersion '${{ matrix.probe_vcvars }}'
          -WindowsSdk '${{ matrix.probe_winsdk }}'
          -OutputDirectory "$env:RUNNER_TEMP/probes"
          ${{ matrix.probe_flags }}

      - name: Upload validation probes
        if: matrix.probe_arches != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msvc-probes-${{ matrix.name }}
          path: ${{ runner.temp }}/probes
          if-no-files-found: error
          retention-days: 30

  collect-legacy:
    name: Collect ${{ matrix.name }}
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.from_run == '' && needs.verify.outputs.legacy_rows != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.legacy_matrix) }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A disc image, its unpacked packages and what they install take up to
      # 10 GB; the image's preinstalled SDKs are not needed here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"

      - name: Install the unpacking tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes p7zip-full cabextract msitools zstd

      - name: Download the installation media
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          url="$(python3 -c 'import json, os
          rows = json.load(open(".github/msvc-legacy-matrix.json"))
          print(next(row["media"] for row in rows if row["name"] == os.environ["NAME"]))')"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 -C - \
            -o "$RUNNER_TEMP/media.iso" "$url"
          ls -la "$RUNNER_TEMP/media.iso"

      - name: Collect
        env:
          NAME: ${{ matrix.name }}
        run: >-
          python3 scripts/collect_legacy_media.py
          --name "$NAME"
          --iso "$RUNNER_TEMP/media.iso"
          --work "$RUNNER_TEMP/work"
          --output "$RUNNER_TEMP/assets"

      - name: Upload assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msvc-libs-${{ matrix.name }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The MASM32 SDK builds its libraries at install time with its own ML.EXE
  # and LINK.EXE, which run here under Wine; see scripts/collect_masm32.py.
  collect-masm32:
    name: Collect ${{ matrix.name }}
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.from_run == '' && needs.verify.outputs.masm32_rows != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.masm32_matrix) }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Wine and the unpacking tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends p7zip-full zstd wine wine32:i386 wine64

      - name: Download the SDK
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          url="$(python3 -c 'import json, os
          rows = json.load(open(".github/masm32-matrix.json"))
          print(next(row["media"] for row in rows if row["name"] == os.environ["NAME"]))')"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 \
            -o "$RUNNER_TEMP/sdk.zip" "$url"

      - name: Build and collect
        env:
          NAME: ${{ matrix.name }}
        run: >-
          python3 scripts/collect_masm32.py
          --name "$NAME"
          --zip "$RUNNER_TEMP/sdk.zip"
          --wine wine
          --work "$RUNNER_TEMP/work"
          --output "$RUNNER_TEMP/assets"

      - name: Upload assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msvc-libs-${{ matrix.name }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # C libraries rizin built with MinGW itself, compiled the same way with
  # Ubuntu's MinGW-w64 cross compilers; see scripts/collect_mingw_library.py.
  collect-mingw:
    name: Collect ${{ matrix.name }}
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.from_run == '' && needs.verify.outputs.mingw_rows != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.mingw_matrix) }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the MinGW-w64 cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 zstd

      - name: Download the source
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          url="$(python3 -c 'import json, os
          rows = json.load(open(".github/mingw-matrix.json"))
          print(next(row["source"] for row in rows if row["name"] == os.environ["NAME"]))')"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 \
            -o "$RUNNER_TEMP/source.tar" "$url"

      - name: Build and collect
        env:
          NAME: ${{ matrix.name }}
        run: >-
          python3 scripts/collect_mingw_library.py
          --name "$NAME"
          --source "$RUNNER_TEMP/source.tar"
          --work "$RUNNER_TEMP/work"
          --output "$RUNNER_TEMP/assets"

      - name: Upload assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msvc-libs-${{ matrix.name }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # C libraries rizin built on Fedora, compiled the same way with that Fedora
  # release's own compilers, unpacked from the packages Koji keeps; see
  # scripts/collect_fedora_library.py.
  collect-fedora:
    name: Collect ${{ matrix.name }}
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.from_run == '' && needs.verify.outputs.fedora_rows != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.fedora_matrix) }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the build and unpacking tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build cpio zstd

      - name: Download the source
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          url="$(python3 -c 'import json, os
          rows = json.load(open(".github/fedora-matrix.json"))
          print(next(row["source"] for row in rows if row["name"] == os.environ["NAME"]))')"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 \
            -o "$RUNNER_TEMP/source.tar" "$url"

      - name: Build and collect
        env:
          NAME: ${{ matrix.name }}
        run: >-
          python3 scripts/collect_fedora_library.py
          --name "$NAME"
          --source "$RUNNER_TEMP/source.tar"
          --work "$RUNNER_TEMP/work"
          --output "$RUNNER_TEMP/assets"

      - name: Upload assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msvc-libs-${{ matrix.name }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The packages rizin's ELF files were made from, downloaded and checked
  # against the SHA-1s sigdb-source records; see scripts/collect_elf_packages.py.
  collect-elf:
    name: Collect ${{ matrix.name }}
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.from_run == '' && needs.verify.outputs.elf_rows != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Launchpad serves the old packages; a few rows at a time.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.verify.outputs.elf_matrix) }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the unpacking tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zstd unzip bzip2

      - name: Download and collect
        env:
          NAME: ${{ matrix.name }}
        run: >-
          python3 scripts/collect_elf_packages.py
          --name "$NAME"
          --work "$RUNNER_TEMP/work"
          --output "$RUNNER_TEMP/assets"
          --jobs 2

      - name: Upload assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msvc-libs-${{ matrix.name }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # A row that fails does not hold the others back: the release carries every
  # row that succeeded, its notes name the run's overall result, and the
  # signature workflow reads the union of all msvc-libs-* releases, so a
  # later run only has to supply what this one missed.
  release:
    name: Create library release
    needs: [collect, collect-legacy, collect-masm32, collect-mingw, collect-fedora, collect-elf]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download every row's assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: msvc-libs-*
          path: assets
          merge-multiple: true
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Index assets
        id: index
        env:
          INPUT_TAG: ${{ inputs.tag }}
          COLLECT_RESULT: ${{ needs.collect.result }}
          LEGACY_RESULT: ${{ needs.collect-legacy.result }}
          MASM32_RESULT: ${{ needs.collect-masm32.result }}
          MINGW_RESULT: ${{ needs.collect-mingw.result }}
          FEDORA_RESULT: ${{ needs.collect-fedora.result }}
          ELF_RESULT: ${{ needs.collect-elf.result }}
          FROM_RUN: ${{ inputs.from_run }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-msvc-libs-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 scripts/summarize_library_assets.py assets --tag "$tag" --commit "$GITHUB_SHA"
          if [ -n "$FROM_RUN" ]; then
            printf '\nThe archives were collected by run %s.\n' "$FROM_RUN" >> assets/RELEASE.md
          elif { [ "$COLLECT_RESULT" != "success" ] && [ "$COLLECT_RESULT" != "skipped" ]; } \
              || { [ "$LEGACY_RESULT" != "success" ] && [ "$LEGACY_RESULT" != "skipped" ]; } \
              || { [ "$MASM32_RESULT" != "success" ] && [ "$MASM32_RESULT" != "skipped" ]; } \
              || { [ "$MINGW_RESULT" != "success" ] && [ "$MINGW_RESULT" != "skipped" ]; } \
              || { [ "$FEDORA_RESULT" != "success" ] && [ "$FEDORA_RESULT" != "skipped" ]; } \
              || { [ "$ELF_RESULT" != "success" ] && [ "$ELF_RESULT" != "skipped" ]; }; then
            {
              echo
              echo "> Not every collection row succeeded in run $GITHUB_RUN_ID ($COLLECT_RESULT, legacy $LEGACY_RESULT, masm32 $MASM32_RESULT, mingw $MINGW_RESULT, fedora $FEDORA_RESULT, elf $ELF_RESULT);"
              echo "> this release holds the rows listed above. Rerun the workflow to add the rest."
            } >> assets/RELEASE.md
          fi
          ls -la assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.index.outputs.tag }}
          PUBLISH: ${{ inputs.publish_release }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          visibility=--draft
          if [ "$PUBLISH" = "true" ]; then
            visibility=
          fi
          # A release that targets a commit whose .github/workflows differs
          # from the default branch needs the workflows permission, which
          # GITHUB_TOKEN never has; the collecting commit is in the notes.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$DEFAULT_BRANCH" \
            --title "Signature-build libraries ($TAG)" \
            --notes-file assets/RELEASE.md \
            $visibility \
            assets/*.tar.zst assets/*.json assets/SHA256SUMS
